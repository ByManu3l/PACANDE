services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pacande
      POSTGRES_PASSWORD: pacande
      POSTGRES_DB: pacande
    ports:
      - "5432:5432"
    volumes:
      - pacande-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacande -d pacande"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pacande-postgres-data:
