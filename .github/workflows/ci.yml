name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pacande
          POSTGRES_PASSWORD: pacande
          POSTGRES_DB: pacande_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pacande -d pacande_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pacande:pacande@localhost:5432/pacande_test?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production-0000000000
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Se lee de .nvmrc para que la versión de CI y la local no
          # puedan desalinearse. Estaban en 22 y 24 respectivamente.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (services, against the Postgres service container)
        run: npx vitest run

      - name: Seed the database (catches regressions in the seed script itself)
        run: npx tsx prisma/seed.ts

      - name: Build
        run: npm run build
