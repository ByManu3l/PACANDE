name: E2E (Playwright)

# Corre en cada push a main, además del disparo manual y el nocturno.
#
# Estuvo solo en manual y nocturno, con el argumento de no alargar el
# ciclo de cada commit. El argumento era razonable y salió caro: el límite
# de intentos de acceso rompió la suite entera y nadie se enteró durante
# varios commits, porque CI seguía en verde. Un flujo que solo corre por
# la noche detecta las regresiones cuando ya están enterradas bajo otros
# cambios.
#
# Va en un job aparte para que su lentitud no bloquee el resultado de
# lint, typecheck y build, que son los que interesa ver rápido.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC diario

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pacande
          POSTGRES_PASSWORD: pacande
          POSTGRES_DB: pacande_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pacande -d pacande_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pacande:pacande@localhost:5432/pacande_e2e?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production-0000000000
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Se lee de .nvmrc para que la versión de CI y la local no
          # puedan desalinearse. Estaban en 22 y 24 respectivamente.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply database migrations and seed
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: Run e2e tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
