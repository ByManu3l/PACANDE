name: E2E (Playwright)

# Deliberately not on every push — a full browser-driven journey suite is
# slower than the CI pipeline and would extend every commit's feedback
# loop. Run it by hand before a release, or let it run nightly.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pacande
          POSTGRES_PASSWORD: pacande
          POSTGRES_DB: pacande_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pacande -d pacande_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pacande:pacande@localhost:5432/pacande_e2e?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production-0000000000
      AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply database migrations and seed
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: Run e2e tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
